# The project's single environment.
#
# Both halves of the repo run inside it -- the Python pipeline (core/, tools/,
# verify/) and the browser app's Node toolchain (app/). That is the point: one
# `conda activate justdrag` and there is no second environment, and no system
# Node in the loop to disagree with the one the app was built against.
#
#   conda env create -f environment.yml     # from the repo root
#   conda activate justdrag
#
# Python packages are pinned to the versions the pipeline and the verification
# oracles were last validated against. Bumping one is not a routine chore: the
# oracle comparisons in README "验证" are what catch a behaviour change, so they
# have to be re-run. requirements.txt holds the full frozen closure.
name: justdrag

channels:
  - conda-forge

dependencies:
  # 3.13.15 as built; the patch moves, the minor is what matters.
  - python=3.13
  # 26.10.0 as built. Vite 7 needs 20.19+ / 22.12+, so any 22+ works.
  - nodejs=26
  - pip

  - pip:
      # rembg brings its own onnxruntime, opencv, pooch and PyMatting; the ones
      # below are pinned because the code calls into them directly or because a
      # version bump there would move the matte.
      - rembg==2.0.73
      - onnxruntime==1.24.4
      - numpy==2.4.3
      - pillow==12.1.1
      - scipy==1.17.1        # verify/ diagnostics only
