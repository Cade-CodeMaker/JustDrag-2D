<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>实时形变 Demo</title>
<style>
  :root {
    --bg: #16161a; --panel: #1e1e24; --line: #33333d;
    --text: #e8e8ee; --dim: #9a9aa8; --accent: #6cc4ff; --accent2: #ffb946;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; overflow: hidden; }
  .app { display: flex; height: 100vh; gap: 0; }
  .stage { flex: 1; position: relative; min-width: 0; background: #101013; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #ov { pointer-events: none; }

  .panel { width: 300px; flex: none; background: var(--panel); border-left: 1px solid var(--line);
    padding: 18px; overflow-y: auto; }
  .panel h1 { font-size: 15px; margin: 0 0 4px; font-weight: 600; }
  .panel .sub { color: var(--dim); font-size: 12px; margin-bottom: 18px; line-height: 1.6; }
  .grp { margin-bottom: 20px; }
  .grp > .title { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--dim); margin-bottom: 10px; display: flex; align-items: center; gap: 7px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
  .row label { flex: none; width: 62px; color: var(--dim); font-size: 12px; }
  .row .val { flex: none; width: 52px; text-align: right; font-variant-numeric: tabular-nums;
    font-size: 12px; color: var(--text); }
  input[type=range] { flex: 1; min-width: 0; -webkit-appearance: none; appearance: none;
    height: 3px; border-radius: 2px; background: var(--line); outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px;
    border-radius: 50%; background: var(--accent); cursor: pointer; }
  input[type=range].leg::-webkit-slider-thumb { background: var(--accent2); }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  button { background: #2a2a33; color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    padding: 7px 12px; font-size: 12px; cursor: pointer; font-family: inherit; }
  button:hover { background: #34343f; }
  button.on { background: var(--accent); color: #06121b; border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .38; cursor: default; }
  button:disabled:hover { background: #2a2a33; }
  button.primary { background: var(--accent); color: #06121b; border-color: var(--accent); font-weight: 600; }
  button.primary:hover { background: #86d2ff; }
  button.primary.dirty::after { content: " •"; }
  .nrow { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .nrow > label { flex: none; width: 42px; color: var(--dim); font-size: 12px; }
  .nrow > .unit { flex: none; color: var(--dim); font-size: 11px; }
  .pair { display: flex; gap: 6px; flex: 1; min-width: 0; }
  input[type=number] { flex: 1; min-width: 0; width: 100%; background: #111116; color: var(--text);
    border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px;
    font: 12px/1.4 ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; }
  input[type=number]:focus { outline: none; border-color: var(--accent); }
  input[type=color] { flex: none; width: 46px; height: 26px; padding: 1px; background: #111116;
    border: 1px solid var(--line); border-radius: 5px; cursor: pointer; }
  #inspector { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  textarea { width: 100%; height: 130px; margin-top: 9px; background: #111116; color: var(--dim);
    border: 1px solid var(--line); border-radius: 6px; padding: 9px; font: 11px/1.5 ui-monospace, Consolas, monospace;
    resize: vertical; display: none; }
  .hint { color: var(--dim); font-size: 11px; line-height: 1.7; margin-top: 10px; }
  #save { font-size: 11px; line-height: 1.5; margin-top: 10px; min-height: 16px;
    color: var(--dim); transition: color .2s; }
  kbd { background: #2a2a33; border: 1px solid var(--line); border-radius: 3px; padding: 1px 5px;
    font: 11px ui-monospace, monospace; }

  #diag { position: absolute; left: 14px; top: 14px; right: 14px; z-index: 10; display: none;
    background: #3a1420; border: 1px solid #d0455f; border-radius: 8px; padding: 14px 16px;
    font: 12px/1.65 ui-monospace, Consolas, monospace; color: #ffd7de; white-space: pre-wrap;
    max-height: 60%; overflow: auto; }
  #diag b { color: #ff8fa3; }
  #diag .hint { color: #ffb3c1; font-family: system-ui, sans-serif; margin-top: 8px; }

  @media (max-width: 900px), (max-height: 560px) {
    .app { flex-direction: column; }
    .stage { flex: 1; min-height: 0; }
    .panel { width: auto; flex: none; max-height: 48vh; border-left: none;
      border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <canvas id="gl"></canvas>
    <canvas id="ov"></canvas>
    <div id="diag"></div>
  </div>
  <aside class="panel">
    <h1>实时形变 Demo</h1>
    <div class="sub">单张立绘 · 每个椭圆一条权重通道<br>枢轴是那个不动的点，其余部分按权重跟着摆</div>

    <!-- One block per body part, generated below at load: how many parts a
         project has is the project's business, so the markup cannot know it at
         build time. Only harm/zoom stay fixed, which is what build_demo.py's
         slider baking still reaches. -->
    <div id="regionSliders"></div>

    <div class="grp">
      <div class="title">整体</div>
      <div class="row"><label>自然度</label><input type="range" id="harm" min="0" max="0.6" step="0.01" value="0.22"><span class="val" id="harmV"></span></div>
      <div class="row"><label>缩放</label><input type="range" id="zoom" min="40" max="130" step="1" value="100"><span class="val" id="zoomV"></span></div>
    </div>

    <div class="grp">
      <div class="title">显示</div>
      <div class="btns">
        <button id="bPlay" class="on">暂停</button>
        <button id="bW">权重图</button>
        <button id="bG" class="on">控制点</button>
        <button id="bBg">背景</button>
      </div>
      <div class="hint">
        <kbd>拖动红叉</kbd> 换支点　<kbd>空格</kbd> 暂停<br>
        椭圆画出的那根短线指向它的 0°：转起来时看它就知道摆了多少。<br>
        椭圆的形状和位置在编辑器里调，这里只调动作。
      </div>
      <div class="btns" style="margin-top:10px">
        <button id="bSave" class="primary">保存到 regions.json</button>
      </div>
      <div class="btns" style="margin-top:8px">
        <button id="bExp">导出区域配置</button>
        <button id="bRst">重置</button>
      </div>
      <div id="save"></div>
      <textarea id="out" readonly></textarea>
    </div>
  </aside>
</div>

<script>
"use strict";

// --- surface failures instead of leaving a silently blank stage ------------
const diagEl = document.getElementById("diag");
let gpuInfo = "";
function diag(title, detail) {
  if (!diagEl) return;
  diagEl.style.display = "block";
  diagEl.innerHTML += `<b>${title}</b>\n${detail}\n${gpuInfo ? "\n" + gpuInfo + "\n" : ""}`;
  diagEl.innerHTML += `<div class="hint">把这段文字发给我即可定位。</div>`;
}
addEventListener("error", e => diag("脚本错误 / Script error",
  `${e.message}\n  at ${e.filename}:${e.lineno}:${e.colno}\n${e.error && e.error.stack || ""}`));
addEventListener("unhandledrejection", e => diag("未处理的 Promise 拒绝",
  String(e.reason && e.reason.stack || e.reason)));

// Set to true by build_demo.py. Guards against opening this template directly --
// it is a build input, not a runnable page.
const BUILT = "__BUILT__";
if (BUILT !== true) {
  diag("这是构建模板，不是可运行的文件",
    "请打开该素材的 assets/<名字>/out/demo.html —— 那个文件已经内嵌了角色图像和区域配置。\n\n" +
    "本文件 tools/template.html 是构建输入，需要先运行：\n" +
    "    python -m tools.build_demo <名字>\n" +
    "才会生成 assets/<名字>/out/demo.html。", "");
  throw new Error("template opened directly; open the built demo.html instead");
}

const IMG_SRC = "data:image/png;base64,__IMAGE_BASE64__";

// ------------------------------------------------------------------- core ---
// Inlined from core/region_field.js at build time (tools/build_demo.py), so the
// page stays one self-contained file. Python has a port of this same field;
// verify/test_weight_golden.* is what keeps the two from drifting apart.
__WEIGHT_JS__

// ---------------------------------------------------------------- regions ---
const DEFAULTS = __REGIONS_JSON__;
// The "_"-prefixed keys of regions.json other than _params. load_regions() drops
// them, so the page never sees them -- but the save button rewrites the whole
// file, and without this it would silently destroy a hand-written _comment.
const META = __REGIONS_META_JSON__;
let regions = JSON.parse(JSON.stringify(DEFAULTS));
const INNER = DeformCore.INNER;   // blob falloff band, in radii

/**
 * Fill in any motion parameter the file left out.
 *
 * A region's amp/spd is what an ellipse inherits, and an ellipse that names
 * none follows its region -- so a hand-written regions.json only has to give
 * the geometry. Every reader of these numbers assumes they are numbers, and an
 * `undefined` in the swing would put NaN into a uniform, which blanks the
 * picture with no explanation at all.
 */
function withMotionDefaults(list) {
  const BLOB_DEFAULTS = { amp: 3.5, spd: 1, delay: 0 };
  list.forEach((reg, i) => {
    if (typeof reg.name !== "string") reg.name = "部位 " + (i + 1);
    if (!Array.isArray(reg.color)) reg.color = [200, 200, 200];
    for (const k of ["amp", "spd"]) {
      if (typeof reg[k] !== "number") reg[k] = BLOB_DEFAULTS[k];
    }
    for (const b of reg.blobs) {
      for (const k of ["amp", "spd", "delay"]) {
        if (typeof b[k] !== "number") b[k] = k === "delay" ? 0 : reg[k];
      }
    }
  });
  return list;
}
withMotionDefaults(regions);

// ------------------------------------------------------------------ shader ---
const VS = `
attribute vec2 aPos;
void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }`;

// The deform pass itself -- core/deform.glsl, inlined at build time. Its Python
// twin (core/deform.py) is what tools/preview.py renders with, so the motion can
// be checked with no GPU in the loop.
const FS = `__DEFORM_GLSL__`;

// -------------------------------------------------------------- gl plumbing ---
const glc = document.getElementById("gl");
const ovc = document.getElementById("ov");
const ov = ovc.getContext("2d");
const gl = glc.getContext("webgl", { alpha: true, premultipliedAlpha: false, antialias: true })
        || glc.getContext("experimental-webgl", { alpha: true, premultipliedAlpha: false });
if (!gl) {
  diag("无法创建 WebGL 上下文", "浏览器未提供 webgl / experimental-webgl 上下文。");
  throw new Error("no webgl");
}

try {
  const dbg = gl.getExtension("WEBGL_debug_renderer_info");
  const v = dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR);
  const r = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
  gpuInfo = `GL: ${v} / ${r}\nWebGL ${gl.getParameter(gl.VERSION)}  ·  GLSL ${gl.getParameter(gl.SHADING_LANGUAGE_VERSION)}`;
} catch (_) { /* renderer info is best-effort */ }

function compile(type, src, label) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(s) || "(no log)";
    const lines = src.split("\n");
    // pull the offending source lines out of the log so the message is actionable
    const frag = [...log.matchAll(/(?:ERROR:\s*\d+:(\d+)|^\s*(\d+):(\d+))/gm)]
      .map(m => parseInt(m[1] || m[3], 10)).filter(n => !isNaN(n));
    const ctx = frag.length
      ? "  " + frag.slice(0, 3).map(n => `${n}| ${(lines[n - 2] || "").trim()}`).join("\n  ")
      : "";
    diag(`${label}着色器编译失败`, `${log}\n${ctx}`);
    throw new Error(label + " shader compile failed: " + log);
  }
  return s;
}
// ------------------------------------------------------------ the program ---
// One shader variant per **ellipse count**, not one for the whole page.
//
// The unit of motion is the ellipse: every ellipse owns a weight channel and a
// rotation of its own, so two ellipses inside one region can swing out of step.
// Four channels share one RGBA texture, and a shader cannot index an array of
// samplers portably (glsl-optimizer and Mesa have shipped builds that reject
// it, and ES 3.00 forbids it outright), so how many weight textures exist has
// to be a compile-time constant. DeformCore.shaderDefines() emits that pair of
// defines and the variants get compiled on demand, which is why core/deform.glsl
// stays one file on disk that the build inlines verbatim.
const VEC4_PER_BLOB = 2;   // uBlobXform + uBlobColor, one vec4 each
const FIXED_VEC4 = 8;      // every other uniform the fragment shader declares, plus slack

const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

const progs = new Map();   // ellipse count -> { prog, u, aPos }

/**
 * The program specialised for `n` ellipses, compiled on first use.
 *
 * Keyed on the ellipse count, not on the weight-texture count the `#define` is
 * named after. Those differ: 1..4 ellipses all make one texture, but the
 * uniform arrays are declared [N_BLOB] and sized to the real count, so the
 * 4-ellipse program cannot serve a 3-ellipse project -- its arrays are a vec4
 * longer than the Float32Array that would be uploaded into them.
 */
function programFor(n) {
  const hit = progs.get(n);
  if (hit) return hit;
  const k = DeformCore.textureCount(n);

  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS, "顶点"));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, DeformCore.shaderDefines(n) + FS, "片元"));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    const log = gl.getProgramInfoLog(prog) || "(no log)";
    diag("着色器链接失败", log);
    throw new Error("link failed: " + log);
  }

  const U = name => gl.getUniformLocation(prog, name);
  const u = { tex: U("uTex"), res: U("uRes"), zoom: U("uZoom"), mode: U("uMode"),
              bg: U("uBg"), xform: U("uBlobXform"), color: U("uBlobColor"), weight: [] };

  gl.useProgram(prog);
  // Every declared sampler needs its unit said out loud. A sampler uniform
  // defaults to 0, so one that is missed silently samples the *character*
  // texture -- a plausible picture, just the wrong one.
  gl.uniform1i(u.tex, 0);
  for (let i = 0; i < k; i++) {
    const loc = U("uWeight" + i);
    if (loc) gl.uniform1i(loc, 1 + i);
    u.weight.push(loc);
  }

  const entry = { prog, u, aPos: gl.getAttribLocation(prog, "aPos") };
  progs.set(n, entry);
  return entry;
}

/** Bind `entry` and point the quad's attribute at it -- both are global GL state. */
function useProgram(entry) {
  gl.useProgram(entry.prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.enableVertexAttribArray(entry.aPos);
  gl.vertexAttribPointer(entry.aPos, 2, gl.FLOAT, false, 0, 0);
}

function makeTex(filter) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  return t;
}

const texChar = makeTex(gl.LINEAR);
const texW = [];   // one RGBA per four ellipses; grown by layout()

/**
 * Put the character on unit 0 and the weight textures on 1..k, and leave them
 * there. The one place that decides which texture lives on which unit: anything
 * that calls activeTexture has to end by calling this, or the next draw reads
 * whatever was left bound -- the failure that looks like a working page
 * deforming towards a picture of the character instead of its weights.
 */
function bindAllTextures() {
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, texChar);
  for (let i = 0; i < texW.length; i++) {
    gl.activeTexture(gl.TEXTURE0 + 1 + i);
    gl.bindTexture(gl.TEXTURE_2D, texW[i]);
  }
  gl.activeTexture(gl.TEXTURE0);
}

/**
 * How many ellipses this device can actually drive.
 *
 * Queried, never assumed. The texture side allows seven weight textures plus
 * the character -- WebGL1 guarantees eight texture units -- which is 28
 * ellipses; but MAX_FRAGMENT_UNIFORM_VECTORS is only guaranteed to be 16, and
 * at two vec4 per ellipse that is four. The smaller of the two is what is real,
 * and on spec-minimum hardware the uniform budget wins by a wide margin.
 */
function capacity() {
  const units = gl.getParameter(gl.MAX_TEXTURE_IMAGE_UNITS);
  const vecs = gl.getParameter(gl.MAX_FRAGMENT_UNIFORM_VECTORS);
  const byTexture = Math.max(0, (units - 1) * 4);
  const byUniform = Math.max(0, Math.floor((vecs - FIXED_VEC4) / VEC4_PER_BLOB));
  return { max: Math.min(byTexture, byUniform), units, vecs };
}

// ------------------------------------------------------------- weight map ---
// The field itself lives in core/region_field.js and is inlined above, so the
// browser and the Python oracle are pinned together by a golden test. Only the
// GL upload stays here.
const WS = 256;   // weight map resolution

/** Flat ellipse list in channel order, plus the channel offset of each region. */
let LAYOUT = { blobs: [], regs: [], lo: [], n: 0, k: 1 };
let CUR = null;            // the program variant for this ellipse count
let POSE = null;           // { xform, color }, rewritten in place every frame
let CAP_OK = true;         // false once the project outgrows the device

/** Recompute the channel layout, the textures and the program for the current region list. */
function layout() {
  const { blobs, regs } = DeformCore.flatBlobs(regions);
  const lo = [];
  let c = 0;
  for (const reg of regions) { lo.push(c); c += reg.blobs.length; }
  LAYOUT = { blobs, regs, lo, n: c, k: DeformCore.textureCount(c) };

  for (let i = texW.length; i < LAYOUT.k; i++) {
    gl.activeTexture(gl.TEXTURE0 + 1 + i);
    const t = makeTex(gl.LINEAR);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, WS, WS, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    texW.push(t);
  }

  // Allocated once and rewritten in place: draw() runs every frame, and every
  // frame is not a rate at which to allocate two Float32Arrays.
  POSE = { xform: new Float32Array(Math.max(1, LAYOUT.n) * 4),
           color: new Float32Array(Math.max(1, LAYOUT.n) * 4) };

  CUR = programFor(LAYOUT.n);
  useProgram(CUR);
  bindAllTextures();

  // Over the device's budget the uniforms would silently wrap and the picture
  // would be wrong in a way that reads as a tuning mistake. Freeze instead, and
  // say so -- draw() checks CAP_OK.
  const cap = capacity();
  CAP_OK = LAYOUT.n <= cap.max;
  if (!CAP_OK) {
    diag("椭圆太多了",
      `这个项目有 ${LAYOUT.n} 个椭圆，这台设备最多同时驱动 ${cap.max} 个`
      + `（片元 uniform 上限 ${cap.vecs} 个 vec4，纹理单元 ${cap.units} 个）。`);
  }
  return LAYOUT;
}

/**
 * Rasterise and upload the whole weight field.
 *
 * Only ever runs at load and on 重置, never per frame: the field is a function
 * of the ellipses' centres, radii and rotations, and nothing this page can do
 * changes those. Dragging moves a pivot, which is not an input to the field, and
 * the sliders only touch amplitude and speed. The editor needs an incremental
 * per-region path because it can edit the ellipses themselves; here that would
 * be machinery with nothing to drive it.
 */
function buildWeights() {
  if (!LAYOUT.n) return;
  const data = DeformCore.rasterize(regions, WS);
  const px = WS * WS * 4;
  gl.activeTexture(gl.TEXTURE1);
  for (let t = 0; t < LAYOUT.k; t++) {
    gl.bindTexture(gl.TEXTURE_2D, texW[t]);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, WS, WS, gl.RGBA, gl.UNSIGNED_BYTE,
      new Uint8Array(data.buffer, t * px, px));
  }
  bindAllTextures();
}

/**
 * Fill POSE for time `t`, in seconds.
 *
 * Amplitude, speed and lag are per **ellipse** -- that is what lets two leg
 * ellipses swing out of step. `delay` is in cycles, the same unit the region
 * phase used to be, so it survives the loop untouched.
 *
 * The rotation is precomputed as (cos, sin) instead of being handed to the
 * shader as an angle. It trades a rounding difference of about 1 ulp against
 * removing sin/cos from every fragment.
 */
function poseAt(t) {
  const tau = Math.PI * 2;
  const swing = (amp, spd, delay) => {
    const a = Math.sin(tau * (t * spd + delay));
    return amp * (a + S.harm * Math.sin(2 * tau * (t * spd + delay))) / (1 + S.harm);
  };
  const xf = POSE.xform, col = POSE.color;
  for (let i = 0; i < LAYOUT.n; i++) {
    const b = LAYOUT.blobs[i], reg = LAYOUT.regs[i];
    const th = swing(b.amp, b.spd, b.delay) * Math.PI / 180;
    xf[i * 4] = reg.pivot[0];
    xf[i * 4 + 1] = reg.pivot[1];
    xf[i * 4 + 2] = Math.cos(th);
    xf[i * 4 + 3] = Math.sin(th);
    col[i * 4] = reg.color[0] / 255;
    col[i * 4 + 1] = reg.color[1] / 255;
    col[i * 4 + 2] = reg.color[2] / 255;
    col[i * 4 + 3] = 0;
  }
  return POSE;
}

// ------------------------------------------------------------------ state ---
// Only what the whole picture shares. Amplitude and speed belong to a region
// (bulk-assigned to its ellipses) and lag belongs to a single ellipse, so none
// of them is a global slider any more -- see REGION_SLIDERS.
const S = { harm: 0.22, zoom: 1, playing: true, weights: false, guides: true, bg: 0 };
const PERSIST = ["harm", "zoom"];   // S keys worth saving
const BUILT_DEFAULTS = JSON.parse(JSON.stringify(DEFAULTS));
let BUILT_PARAMS;   // filled once the sliders are bound, so the markup stays the source of truth
let t0 = performance.now(), phaseT = 0;

// -------------------------------------------------------------- persistence ---
// Edits live in localStorage so a refresh never loses tuning. Storage can throw
// (private mode, blocked site data), so every access is guarded and surfaced.
// The key is per-asset: every built demo is opened from the same file:// origin,
// so one shared key would let one asset's tuning load over another's.
const LS_KEY = "nova-art-deform-__LS_SUFFIX__";
let saveTimer = null, lsOK = true;

function saveState() {
  setDirty(true);
  if (!lsOK) return;
  clearTimeout(saveTimer);
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      v: 2, regions, params: Object.fromEntries(PERSIST.map(k => [k, S[k]]))
    }));
    markSaved("已自动保存 " + new Date().toLocaleTimeString("zh-CN", { hour12: false }));
  } catch (e) {
    lsOK = false;
    markSaved("无法自动保存：" + e.name + " —— 请用「导出」手动备份", true);
  }
}
// dragging fires dozens of times a second; coalesce the writes
function saveSoon() { setDirty(true); clearTimeout(saveTimer); saveTimer = setTimeout(saveState, 220); }

function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    // A stale or hand-edited entry can be structurally wrong. Without this
    // check the layout pass throws on `for (const b of reg.blobs)` at load, which
    // surfaces as a blank stage rather than a lost edit.
    const ok = s && s.v === 2 && Array.isArray(s.regions) && s.regions.length
      && s.regions.every(r => r && Array.isArray(r.blobs) && Array.isArray(r.pivot));
    // `v` is 2 because the region list became an array and the motion moved
    // down onto the ellipse. This is R&D and no compatibility is owed, so an
    // entry in the old shape is dropped rather than half-restored.
    return ok ? s : null;
  } catch (e) { return null; }
}

// The save button carries a dot while there are edits the file does not have.
let dirtyEl = null;
function setDirty(on) {
  if (!dirtyEl) dirtyEl = document.getElementById("bSave");
  if (dirtyEl) dirtyEl.classList.toggle("dirty", !!on);
}

function markSaved(msg, bad) {
  const el = document.getElementById("save");
  if (!el) return;
  el.textContent = msg;
  el.style.color = bad ? "#ff8fa3" : "var(--dim)";
}

function applyParams(p) {
  for (const k of PERSIST) {
    const s = sliders[k];
    if (p && typeof p[k] === "number" && s) { s.el.value = p[k] / s.scale; s.sync(); }
  }
}
const img = new Image();
img.onload = () => {
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, texChar);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
  draw(performance.now());          // paint immediately, even if rAF is throttled
  requestAnimationFrame(loop);
};
img.onerror = () => diag("角色贴图加载失败", "内嵌的 data URI 无法解码为图像。");
img.src = IMG_SRC;
// a tab opened in the background gets no rAF until it is shown; repaint on return
addEventListener("visibilitychange", () => {
  if (!document.hidden && img.complete && img.naturalWidth) { t0 = performance.now(); draw(t0); }
});

// ------------------------------------------------------------------ resize ---
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round(glc.clientWidth * dpr));
  const h = Math.max(1, Math.round(glc.clientHeight * dpr));
  for (const c of [glc, ovc]) {
    if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  }
  ov.setTransform(dpr, 0, 0, dpr, 0, 0);
  gl.viewport(0, 0, w, h);
}
new ResizeObserver(resize).observe(glc);

// ---- square mapping shared by shader, overlay and pointer input -----------
function square() {
  const w = glc.clientWidth, h = glc.clientHeight;
  const side = Math.min(w, h) * S.zoom;
  return { side, ox: (w - side) / 2, oy: (h - side) / 2 };
}
const toScreen = (x, y) => { const q = square(); return [q.ox + x * q.side, q.oy + y * q.side]; };
function toImage(clientX, clientY) {
  const r = glc.getBoundingClientRect(), q = square();
  return [(clientX - r.left - q.ox) / q.side, (clientY - r.top - q.oy) / q.side];
}

// ---------------------------------------------------------------- overlay ----
/**
 * A pill label, so a pivot can say which body part it belongs to.
 *
 * Drawn on the overlay canvas rather than as a DOM node: the overlay is already
 * repainted every frame and already knows where the pivot lands in screen
 * space, so this needs no positioning logic of its own and cannot desync from
 * the crosshair it labels.
 */
function pill(text, x, y, rgb) {
  ov.font = '600 13px ui-sans-serif, system-ui, "Segoe UI", sans-serif';
  ov.textBaseline = "middle";
  const w = Math.round(ov.measureText(text).width) + 16, h = 22;
  // To the right of the pivot, flipping left if that would leave the canvas.
  let bx = x + 16;
  if (bx + w > glc.clientWidth - 4) bx = x - 16 - w;
  const by = y - h / 2;

  ov.beginPath();
  if (ov.roundRect) ov.roundRect(bx, by, w, h, 6); else ov.rect(bx, by, w, h);
  ov.fillStyle = "rgba(12,14,18,0.88)"; ov.fill();
  ov.strokeStyle = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`; ov.lineWidth = 1.5; ov.stroke();

  ov.fillStyle = "#fff";
  ov.fillText(text, bx + 8, by + h / 2 + 0.5);
}

function drawOverlay() {
  ov.clearRect(0, 0, glc.clientWidth, glc.clientHeight);
  if (!S.guides) return;
  const q = square();
  for (const reg of regions) {
    const col = reg.color;
    const hot = !!hover && hover.reg === reg;
    for (const b of reg.blobs) {
      const [cx, cy] = toScreen(b.c[0], b.c[1]);
      const rx = b.r[0] * q.side, ry = b.r[1] * q.side;
      const th = b.rot * Math.PI / 180;

      ov.lineWidth = 2;
      ov.beginPath();
      ov.ellipse(cx, cy, rx, ry, th, 0, Math.PI * 2);
      ov.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},${hot ? 1 : 0.85})`;
      ov.stroke();

      // inner (fully weighted) boundary
      ov.beginPath();
      ov.ellipse(cx, cy, rx * INNER, ry * INNER, th, 0, Math.PI * 2);
      ov.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},0.30)`;
      ov.lineWidth = 1; ov.stroke(); ov.lineWidth = 2;

      // Which way this ellipse is pointing.
      //
      // A rotation is only legible when the thing rotating is not symmetric,
      // and a bare ellipse is: a quarter turn looks like the same ellipse. So a
      // line that stands straight up at rot = 0 and swings with it -- drawn on
      // every ellipse, because the point is to compare them.
      const L = ry * 1.12;
      const ux = Math.sin(th), uy = -Math.cos(th);
      ov.beginPath();
      ov.moveTo(cx, cy);
      ov.lineTo(cx + ux * L, cy + uy * L);
      ov.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},0.55)`;
      ov.lineWidth = 1.5;
      ov.stroke();

      ov.beginPath(); ov.arc(cx, cy, 4, 0, Math.PI * 2);
      ov.fillStyle = `rgb(${col[0]},${col[1]},${col[2]})`; ov.fill();
    }

    const [px, py] = toScreen(reg.pivot[0], reg.pivot[1]);
    const pivotSel = !!sel && sel.reg === reg;

    ov.strokeStyle = pivotSel ? "#ffd24d" : "#ff4d4d";
    ov.lineWidth = hot ? 3 : 2.5;
    ov.beginPath();
    ov.moveTo(px - 12, py); ov.lineTo(px + 12, py);
    ov.moveTo(px, py - 12); ov.lineTo(px, py + 12); ov.stroke();
    ov.beginPath(); ov.arc(px, py, 6, 0, Math.PI * 2);
    ov.strokeStyle = "#fff"; ov.lineWidth = 2; ov.stroke();

    // The label is the only thing that says which body part a pivot turns. A
    // crosshair is a crosshair; with three of them there is no telling the
    // head's from the chest's without text.
    if (hot) pill(reg.name, px, py, col);
  }
  ov.lineWidth = 2;
}

// ------------------------------------------------------------------ input ----
// `sel` and `hover` hold a live reference into `regions`: {reg, kind:"pivot"}.
//
// The pivot is the only thing this page edits. What decides the weight field is
// the ellipses' geometry, and fitting those belongs to the editor -- a viewer
// that silently reshaped the field from a wheel gesture, with nothing on screen
// saying it could, would be a worse tool than one that only moves the joint.
// Holding an object reference rather than an index or a key is what makes this
// survive a rebuild of the list, which is what 重置 does.
let sel = null, hover = null, drag = null;
ovc.style.pointerEvents = "none";
glc.style.cursor = "default";

/** The pivot under the cursor, topmost first -- later regions paint over earlier ones. */
function pivotAt(ix, iy) {
  for (let r = regions.length - 1; r >= 0; r--) {
    const reg = regions[r];
    if (Math.hypot(ix - reg.pivot[0], iy - reg.pivot[1]) < 0.035) return { reg, kind: "pivot" };
  }
  return null;
}

glc.addEventListener("pointerdown", e => {
  const [ix, iy] = toImage(e.clientX, e.clientY);
  const h = pivotAt(ix, iy);
  if (!h) { sel = null; drawOverlay(); return; }
  sel = h;
  drag = { dx: ix - h.reg.pivot[0], dy: iy - h.reg.pivot[1] };
  glc.setPointerCapture(e.pointerId);
  glc.style.cursor = "grabbing";
  drawOverlay();
});

glc.addEventListener("pointermove", e => {
  const [ix, iy] = toImage(e.clientX, e.clientY);
  if (!drag) {
    const h = pivotAt(ix, iy);
    // The overlay is repainted every frame anyway, so the label follows the
    // cursor with no invalidation logic -- only the cursor shape is set here.
    if ((h && h.reg) !== (hover && hover.reg)) {
      hover = h;
      glc.style.cursor = h ? "grab" : "default";
    }
    return;
  }
  // No buildWeights(): the field depends on the ellipses' centres, radii and
  // rotations, and a pivot is none of those -- it is read from a uniform every
  // frame. Re-baking 65536 pixels per pointermove would be pure waste.
  const p = sel.reg.pivot;
  p[0] = Math.min(1.4, Math.max(-0.4, ix - drag.dx));
  p[1] = Math.min(1.4, Math.max(-0.4, iy - drag.dy));
  drawOverlay();
  saveSoon();
});

const endDrag = () => { if (drag) saveState(); drag = null; glc.style.cursor = "default"; };
glc.addEventListener("pointerup", endDrag);
glc.addEventListener("pointercancel", endDrag);
glc.addEventListener("pointerleave", () => {
  if (hover) { hover = null; glc.style.cursor = "default"; }
});

// ------------------------------------------------------------------- ui ------
const sliders = {};   // key -> { el, sync, scale }, so restored state can drive the widgets
function bind(id, key, fmt, scale = 1) {
  const el = document.getElementById(id), out = document.getElementById(id + "V");
  // fmt receives the raw slider value (what the user sees), S[key] gets it scaled
  const sync = () => { const raw = parseFloat(el.value); S[key] = raw * scale; out.textContent = fmt(raw); };
  el.addEventListener("input", () => { sync(); saveState(); });
  sliders[key] = { el, sync, scale };
  sync();
}
bind("harm", "harm", v => v.toFixed(2));
bind("zoom", "zoom", v => v.toFixed(0) + "%", 0.01);   // raw is percent; S.zoom is a factor
BUILT_PARAMS = { ...S };

/**
 * The two numbers a region can bulk-assign.
 *
 * Labels and ranges mirror REGION_PARAMS in app/src/regions.js -- the editor's
 * panel offers the same ones, and a demo slider that disagreed with it would
 * write a value the editor then clamps back.
 */
const REGION_SLIDERS = [
  { key: "amp", label: "幅度", min: 0, max: 14, step: 0.1, fmt: v => v.toFixed(1) + "°" },
  { key: "spd", label: "速度", min: 0, max: 3, step: 0.01, fmt: v => v.toFixed(2) + "×" },
];

/**
 * One block per body part, built here rather than in the markup.
 *
 * How many parts a project has is the project's decision, so the template
 * cannot carry a fixed form for them -- and build_demo.py bakes its defaults by
 * rewriting `value=` in the markup, which only works for a form that does not
 * change shape. Region names are user text, so everything goes in through
 * textContent, never innerHTML.
 *
 * A slider is a **bulk assignment**: dragging it writes the same number into
 * every ellipse of that region. Per-ellipse differences -- which is what makes
 * two legs swing out of step -- are set in the editor, by ellipse lag.
 */
function buildRegionSliders() {
  const box = document.getElementById("regionSliders");
  box.textContent = "";
  regions.forEach(reg => {
    const grp = document.createElement("div");
    grp.className = "grp";

    const title = document.createElement("div");
    title.className = "title";
    const dot = document.createElement("span");
    dot.className = "dot";
    dot.style.background = `rgb(${reg.color[0]},${reg.color[1]},${reg.color[2]})`;
    title.append(dot, document.createTextNode(reg.name));
    grp.append(title);

    for (const spec of REGION_SLIDERS) {
      const row = document.createElement("div");
      row.className = "row";
      const label = document.createElement("label");
      label.textContent = spec.label;
      const el = document.createElement("input");
      el.type = "range";
      el.min = spec.min; el.max = spec.max; el.step = spec.step;
      el.value = reg[spec.key];
      const out = document.createElement("span");
      out.className = "val";

      const sync = () => {
        // Region value and ellipses move together: the region's is what a
        // hand-written file inherits from, the ellipses' is what the animation
        // actually reads.
        const v = parseFloat(el.value);
        out.textContent = spec.fmt(v);
        reg[spec.key] = v;
        for (const b of reg.blobs) b[spec.key] = v;
      };
      el.addEventListener("input", () => { sync(); saveSoon(); });
      row.append(label, el, out);
      grp.append(row);
      sync();
    }
    box.append(grp);
  });
}

// restore any tuning from a previous visit, then report what happened
const restored = loadState();
if (restored) {
  regions = withMotionDefaults(restored.regions);
  applyParams(restored.params);
}

// The layout follows the region list, and the region list is only final once
// the restore above has had its say -- a restored project can have a different
// number of ellipses, and the shader variant is compiled for that count.
buildRegionSliders();
layout();
buildWeights();
drawOverlay();

markSaved(restored
  ? "已恢复上次编辑的配置 · 点「重置」可回到初始状态"
  : (lsOK ? "编辑会自动保存" : "此环境无法自动保存，请手动导出"));

const bPlay = document.getElementById("bPlay");
bPlay.onclick = () => { S.playing = !S.playing; bPlay.classList.toggle("on", S.playing);
  bPlay.textContent = S.playing ? "暂停" : "播放"; };
const bW = document.getElementById("bW");
bW.onclick = () => { S.weights = !S.weights; bW.classList.toggle("on", S.weights); };
const bG = document.getElementById("bG");
bG.onclick = () => { S.guides = !S.guides; bG.classList.toggle("on", S.guides); drawOverlay(); };
const bBg = document.getElementById("bBg");
const BG = ["棋盘", "深色", "浅色"];
bBg.onclick = () => { S.bg = (S.bg + 1) % 3; bBg.textContent = "背景:" + BG[S.bg]; drawOverlay(); };
const bRst = document.getElementById("bRst");
bRst.onclick = () => {
  try { localStorage.removeItem(LS_KEY); } catch (_) { /* nothing to clear */ }
  regions = withMotionDefaults(JSON.parse(JSON.stringify(BUILT_DEFAULTS)));
  applyParams(BUILT_PARAMS);
  sel = null; hover = null;
  buildRegionSliders();
  layout();          // the restored project may have had a different ellipse count
  buildWeights(); drawOverlay();
  setDirty(true);   // the working copy no longer matches what is on disk
  markSaved("已重置为初始状态，本地保存已清除");
};
// -------------------------------------------------------------- saving -----
// The demo is opened from file://, so there is no server to post to. Instead the
// File System Access API: pick regions.json once, keep the handle in IndexedDB
// under the same per-asset key as localStorage, and every later save is silent.
// (Verified on file:// including the handle round-trip.) Browsers without the
// API fall back to the copy-paste export below.
const DEFAULT_COMMENT = "区域配置：每个部位是一个枢轴加若干椭圆；每个椭圆有自己的幅度/速度/滞后，"
  + "所以同一部位里的两个椭圆可以错开摆。_params 是构建时烘焙进滑块的默认值。";

function savePayload() {
  // Same shape regions.json already has, so the result can go straight back
  // into the build. Region objects are carried through untouched -- rounding
  // c/r here would make save -> rebuild -> compare_golden drift.
  const meta = Object.prototype.hasOwnProperty.call(META, "_comment")
    ? META : { _comment: DEFAULT_COMMENT, ...META };
  return JSON.stringify({
    ...meta,
    _params: Object.fromEntries(PERSIST.map(k => [k, +S[k].toFixed(4)])),
    regions,
  }, null, 1);
}

function exportJSON(text, note) {
  const ta = document.getElementById("out");
  ta.style.display = "block";
  ta.value = text;
  ta.select();
  navigator.clipboard?.writeText(text)
    .then(() => markSaved(note || "配置已复制到剪贴板"))
    .catch(() => markSaved(note || "已生成配置，请手动全选复制（剪贴板被拒绝）"));
}

let cachedHandle = null;   // kept in memory so the first click needs no IDB await

function idbOpen() {
  return new Promise((res, rej) => {
    const rq = indexedDB.open("nova-art-deform", 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore("handles");
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
function idbRun(mode, fn) {
  return idbOpen().then(db => new Promise((res, rej) => {
    const tx = db.transaction("handles", mode);
    const rq = fn(tx.objectStore("handles"));
    tx.oncomplete = () => { db.close(); res(rq ? rq.result : undefined); };
    tx.onerror = tx.onabort = () => { db.close(); rej(tx.error); };
  }));
}

async function canWriteFile(h) {
  if (!h || !h.queryPermission) return false;
  const q = { mode: "readwrite" };
  if (await h.queryPermission(q) === "granted") return true;
  // requestPermission needs a user gesture -- the click that got us here is one.
  return await h.requestPermission(q) === "granted";
}

async function saveToFile(text) {
  let h = cachedHandle;
  if (!h) { try { h = await idbRun("readonly", s => s.get(LS_KEY)); } catch (_) { /* no IDB */ } }
  if (h && !(await canWriteFile(h))) h = null;
  if (!h) {
    // A stable id makes Chrome reopen in the folder picked last time.
    h = await window.showSaveFilePicker({
      id: "justdrag-regions",
      suggestedName: "regions.json",
      types: [{ description: "区域配置", accept: { "application/json": [".json"] } }],
    });
  }
  const w = await h.createWritable();
  await w.write(text);
  await w.close();
  cachedHandle = h;
  // Best-effort: losing the cached handle only costs one extra picker next time.
  try { await idbRun("readwrite", s => s.put(h, LS_KEY)); } catch (_) { /* not fatal */ }
  return h.name;
}

document.getElementById("bSave").onclick = async () => {
  const text = savePayload();
  if (typeof window.showSaveFilePicker !== "function") {
    exportJSON(text, "此浏览器不支持直接写盘 —— 已改为导出，请手动覆盖 regions.json");
    return;
  }
  try {
    const name = await saveToFile(text);
    setDirty(false);
    markSaved(`已写入 ${name} · 需重新运行 tools.build_demo 才会烘焙进 demo`);
  } catch (e) {
    if (e && e.name === "AbortError") { markSaved("已取消保存"); return; }
    markSaved("保存失败：" + ((e && e.name) || e) + " —— 已改为导出，请手动覆盖", true);
    exportJSON(text, null);
  }
};

const bExp = document.getElementById("bExp");
bExp.onclick = () => {
  const ta = document.getElementById("out");
  if (ta.style.display === "block") { ta.style.display = "none"; return; }
  exportJSON(savePayload(), null);
};
addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); bPlay.click(); }
});

// ------------------------------------------------------------------ frame ----
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
// draw() is split from the loop so a frame can be painted synchronously on load.
// requestAnimationFrame never fires in a backgrounded tab, which would otherwise
// leave a freshly-opened tab blank until it is focused.
function draw(now) {
  const dt = Math.min(0.05, (now - t0) / 1000); t0 = now;
  if (S.playing && !reduce) phaseT += dt;

  const u = CUR.u;
  gl.uniform2f(u.res, glc.width, glc.height);
  gl.uniform1f(u.zoom, S.zoom);
  gl.uniform1i(u.mode, S.weights ? 1 : 0);
  gl.uniform1i(u.bg, S.bg);
  gl.uniform4fv(u.xform, poseAt(phaseT).xform);
  gl.uniform4fv(u.color, POSE.color);

  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  // Over the device's ellipse budget the uniforms would silently wrap and the
  // picture would be wrong in a way that reads as a tuning mistake. Freeze
  // instead; layout() has already put the reason on screen.
  if (CAP_OK) gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  drawOverlay();
}
function loop(now) { draw(now); requestAnimationFrame(loop); }
resize();
drawOverlay();
</script>
</body>
</html>
